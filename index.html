<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL POLLO LOCO</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/5_background/favicon-el-pollo-loco.png" type="image/x-icon">

    <script src="./models/hub.static.class.js"></script>

    <script src="./models/drawable-object.class.js"></script>

    <script src="./models/movable-object.class.js"></script>
    <script src="./models/background.object.class.js"></script>
    <script src="./models/clouds.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/mini-chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>

    <script src="./models/collectable.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsabottle.class.js"></script>

    <script src="./models/statusbar.class.js"></script>
    <script src="./models/healthbar.class.js"></script>
    <script src="./models/coinbar.class.js"></script>
    <script src="./models/bottlebar.class.js"></script>
    <script src="./models/bossbar.class.js"></script>

    <script src="./models/world.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    
    <script src="./models/keyboard.class.js"></script>

    <script src="./models/throwable-object.class.js"></script>
</head>
<body onload="init()">

    <h1>EL POLLO LOCO</h1>

    <div id="tilt-screen">
        <img src="./img/0_ui/tilt-phone.gif" alt="Please rotate your phone">
    </div>

    <div id="center-container">
        <div>
            <button id="mute-btn" class="btn-style" onclick="AudioHub.toggleMute(), mouseClick()">🔈</button>
        </div>
        <div id="start-screen">
            <div id="start-screen-buttons">
                <div id="top-btn-bar">
                    <div>
                        <button id="controll-info" class="btn-style" onclick="mouseClick(), showControlls()">&#9432;</button>
                        <button class="btn-style" onclick="mouseClick(), window.open('impressum.html', '_blank')">Impressum</button>
                    </div>
                </div>
                <div id="bottom-btn-bar">
                    <button id="start-button" class="btn-style" onclick="startGame(), initLevel(), mouseClick()">Start</button>
                </div>
            </div>
            <div id="key-info" class="hide">
                <h2>Controlls</h2>
                <span>
                    Move: W & D
                </span>
                <span>
                    Jump: Spacebar
                </span>
                <span>
                    Throw bottles: Shift
                </span>
            </div>
        </div>
        <div id="win-screen">
            <img src="img/You won, you lost/You win B.png" alt="win screen">
            <button class="btn-style" onclick="restartGame()">PLAY AGAIN</button>
        </div>
        <div id="loose-screen">
            <img src="img/You won, you lost/You lost b.png" alt="loose screen">
            <button class="btn-style" onclick="restartGame()">PLAY AGAIN</button>
        </div>
        <div id="mobile-ui">
            <div id="mobile-movement" class="img-position">
                <button id="mo-ui-left" class="btn-style img-position">
                    <img src="./img/0_ui/left-ui.png" alt="left">
                </button>
                <button id="mo-ui-right" class="btn-style img-position">
                    <img src="./img/0_ui/right-ui.png" alt="right">
                </button>
            </div>
            <div id="mobile-action" class="img-position">
                <button id="mo-ui-throw" class="btn-style img-position">
                    <img src="./img/0_ui/throw-bottle-ui.png" alt="throw">
                </button>
                <button id="mo-ui-jump" class="btn-style img-position">
                    <img src="./img/0_ui/jump-ui.png" alt="jump">
                </button>
            </div>
        </div>
        <canvas id="canvas" width="720" height="480"></canvas>
    </div>
    
    
    <script src="./scripts/game.js"></script>
</body>
</html>
